sonar.projectKey=fastpix-php
sonar.projectName=FastPix PHP SDK
sonar.sources=src
sonar.tests=Tests

# ---------------------------------------------------------------------------
# Rule exclusions for the auto-generated model layer.
#
# The classes under src/Models are data-transfer objects generated from the
# OpenAPI spec. Their constructors mirror the request/response schema field by
# field, so a request DTO legitimately accepts many (>7) named parameters --
# that is how SDK consumers build a request (e.g.
# new CreateMediaRequest(inputs: [...], metadata: [...], title: ...)).
#
# S107 ("too many parameters") targets hand-written functions where a long
# parameter list signals a design smell. It does not apply to generated
# data-carrier constructors: reducing the parameter count there would remove
# named-argument construction and break every caller, without improving the
# model. We therefore suppress S107 for the generated model layer only.
# ---------------------------------------------------------------------------
sonar.issue.ignore.multicriteria=g1

sonar.issue.ignore.multicriteria.g1.ruleKey=php:S107
sonar.issue.ignore.multicriteria.g1.resourceKey=src/Models/**/*.php
